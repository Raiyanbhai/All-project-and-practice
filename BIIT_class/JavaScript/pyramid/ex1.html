<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var i=1, j=5, k=1;
        for(i=1; i<=5; i++)
        {
            for(j=5; j>i; j--)
            {
                document.write("&nbsp;&nbsp;")
            }
            for(k=1; k<=i; k++)
            {
                document.write(k,"&nbsp;&nbsp;")
            }
            document.write("<br>")
        }
        

    </script>
</body>
</html>
