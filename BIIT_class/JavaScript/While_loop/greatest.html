<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a,b;
        a=prompt("Enter first number");
        b=prompt("Enter second number");
         document.write("A =",a)
         document.write("<br>");
         document.write("B =",b)
         document.write("<br>");
        if(a>b){
            document.write("B is smaller number :",b);
        }
        else{
            document.write("A is smaller number :",a);
        }
    </script>
</body>
</html>
