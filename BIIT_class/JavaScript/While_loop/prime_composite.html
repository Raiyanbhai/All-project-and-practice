<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var num;
        num=prompt("Enter first number");
        document.write("A =",num)
        document.write("<br>");
        if(num%2==0){
            document.write("Entered number is 'Even' :",num);
        }
        else{
            document.write("Entered number is 'Odd' :",num);
        }
    </script>
</body>
</html>
