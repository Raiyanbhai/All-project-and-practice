<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var data=[ 
            ["SN", "Name", "Address", "Age"], 
            ["1", "Raiyan", "Biratnagar", "20"], 
            ["2", "Pratap", "Brt", "20"], 
            ["3", "Dolli_chaibala", "India", "35"],
            ["4", "Panki", "Nepal", "18"]
        ],a=0;
        document.write("<table border=1 cellspacing=0 cellpadding=5>")
            
        for(i=0; i<data.length; i++)
        {
            document.write("<tr>");
            for(j=0; j<data[i].length; j++)
            {
                if(data[i][j]==data[0][a])
                {
                    document.write("<th><b>",data[i][j],"&nbsp;</th>");
                }
                else{
                    document.write("<td>",data[i][j],"&nbsp;</td>");
                }
                a++;
            }
            document.write("</tr>");
        }
    document.write("</table>",data.length);
    </script>
</body>
</html>
