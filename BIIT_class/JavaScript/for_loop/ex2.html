<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>looping</title>
</head>
<body>
    <script>
        var a=11111, b=10000;
        for(var i=1; i<=5; i++)
        {
            document.write(a,"<br>");
            a=a-b;
            b=b/10;
            
        }
    </script>
</body>
</html>
