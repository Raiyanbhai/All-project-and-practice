<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forloop sequence</title>
</head>
<body>
    <script>
        var a=1, b=2, c=0, d=1, e=1, f=0, g=10, h=0, i=1;
        document.write("<u>",a,"</u><br> <br>");
        for(i=1; i<=7; i++)
        {
            a=a*10+b;
            b=b+1;
            f=a;

            c=d*e+c;
            d=d+1;
            e=e*10;
            h=c;
            document.write("<u>",f*g+h,"</u><br><br>");
            g=g*10;
        }
    </script>
</body>
</html>
