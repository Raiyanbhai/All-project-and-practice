<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>looping</title>
</head>
<body>
    <script>
        var a=1, b=2, c=1, d=4, e=3, f=1, g=1, i=1, count=1;
        if(count==1)
        {
            for(i=1; i<=5; i++)
            {
                document.write(c,"<br>");
                a=a*10+b;
                b=b+1;
                c=a;
                count++;
            }   
        }
        count=5;
        f=c-6;
        if(count==5 || count<=9)
        {
            for(i=1; i<=4; i++)
            {
                document.write(f*g+d,"<br>");
                d=d*10+e;
                e=e-1;
                g=g*10;
            }
        }  
        else{document.write("hell<br>");}      
    </script>
</body>
</html>
