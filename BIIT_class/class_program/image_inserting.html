<!--    
To link a image to the web page we use <image> tag
syntax: <image src="location\filename.extension"></image>
Where 
     img=image
     src= source

To link a video to the web page we use <video> tag
syntax: <video src="location\filename.extension">

To link a audio to the web page we use <audio> tag
syntax: <audio src="location\filename.extension">

Hyperlink:
To link other document with web page we use <a>---</a> tag
syntax: <a href="location\filename.extension"> some text</a>
where,
     a=anchor
     h=hyperlink
     ref=reference

Example:
-->
