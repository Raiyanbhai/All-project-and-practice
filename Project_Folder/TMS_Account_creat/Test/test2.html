<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dive{
            background-color: aquamarine;
            width: 20%;
            margin-left: 30rem;
            margin-top: 50px;
        }
        .countId{
            height: 50px;
            width: 50px;
            background-color: rgb(223, 221, 221);
            color: rgb(5, 4, 4);
            padding: 30px 0 0 15px;
            margin: 10px;
            cursor: pointer;
            right: 10px;
        }
        .countId:active{
            background-color: white;
        }
        button{
            background-color: greenyellow;
            cursor: pointer;
        }
        button:active{
            background-color: rgb(114, 176, 21);
        }
    </style>
</head>
<body>
    <div class="dive">
    <div dataValue="1" class="countId" id="ides1">hello 1</div>
    <div dataValue="2" class="countId" id="ides2">hello 2</div>
    <div dataValue="3" class="countId" id="ides3">hello 3</div>
    <div dataValue="4" class="countId" id="ides4">hello 4</div>
    <div dataValue="5" class="countId" id="ides5">hello 5</div>
    <div dataValue="6" class="countId" id="ides6">hello 6</div>
    </div>
    <button type="button" id="btnClick">click me!</button>
    <script src="rough.js"></script>
</body>
</html>
