<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Button Example</title>
    <style>
        .btn-outline {
            /* Example styles */
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
        }
        .upload-button {
            display: inline-flex;
            align-items: center;
        }
        .leading-icon {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <label class="btn btn-outline upload-button" style="border: 1px solid transparent; border-radius: 0.25rem; border-color: #0078D7; color: #0078D7 !important;">
        <div class="leading-icon">
            <svg fill="inherit" height="18" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 2L20 8V20C20 20.5304 19.7893 21.0391 19.4142 21.4142C19.0391 21.7893 18.5304 22 18 22H6C5.46957 22 4.96086 21.7893 4.58579 21.4142C4.21071 21.0391 4 20.5304 4 20V4C4 3.46957 4.21071 2.96086 4.58579 2.58579C4.96086 2.21071 5.46957 2 6 2H14ZM18 20V9H13V4H6V20H18ZM12 12L16 16H13.5V19H10.5V16H8L12 12Z" fill="inherit"></path>
            </svg>
            Upload
        </div>
        <input hidden multiple type="file" accept=".pdf">
    </label>
</body>
</html>
