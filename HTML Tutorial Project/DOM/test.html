<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var number=[1,2,3,4,5],numind,randvalue, rand;
        rand=Math.random()*2;
        document.write("rand= ",rand);
        numind=Math.floor(rand);
        document.write("<br>numind= ",numind);
        randvalue=number[numind];
        document.write("<br>randvalue= ",randvalue);
    </script>
</body>
