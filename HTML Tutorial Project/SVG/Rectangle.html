<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rect Element</title>
    <style>
        div{
            height: 100%;
            width: 100%;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div>
        <svg viewBox="0 0 100 100">
            <rect x="7.5" y="7.5" width="85" height="85" stroke-width="0.0" fill="pink"/>
            <rect x="30" y="30" width="40" height="40" stroke-width="5" fill="blue" stroke="yellow"/>
    
            <rect x="10" y="10" width="20" height="20" stroke-width="5" stroke="green" fill="aqua"/>
            <rect x="10" y="70" width="20" height="20" stroke-width="5" stroke="red" fill="aqua"/>
            <rect x="70" y="10" width="20" height="20" stroke-width="5" stroke="blue" fill="aqua"/>
            <rect x="70" y="70" width="20" height="20" stroke-width="5" stroke="yellow" fill="aqua"/>
    
            <rect x="42" y="42" rx="2" width="15" height="15" stroke-width=".2" stroke="black" fill="red"/> 
    
            <rect x="7.5" y="7.5" width="85" height="25" stroke-width=".5" stroke="lightgrey" fill="none"/>
            <rect x="7.5" y="7.5" width="25" height="85" stroke-width=".5" stroke="lightgrey" fill="none"/>
            <rect x="7.5" y="67.5" width="85" height="25" stroke-width=".5" stroke="lightgrey" fill="none"/>
            <rect x="67.5" y="7.5" width="25" height="85" stroke-width=".5" stroke="lightgrey" fill="none"/>
            
            <rect x="7.8" y="45" width="24.4" height="8" fill="darkblue"/>
            <rect x="7.8" y="32.8" width="8" height="34.5" fill="brown"/>
            <rect x="67.8" y="45" width="24.4" height="8" fill="darkblue"/>
            <rect x="84.3" y="32.8" width="8" height="34.5" fill="brown"/>
            <rect x="46" y="7.8" width="8" height="24.4" fill="darkblue"/>
            <rect x="32.7" y="7.8" width="34.5" height="8" fill="brown"/>
            <rect x="46" y="67.7" width="8" height="24.4" fill="darkblue"/>
            <rect x="32.7" y="84.2" width="34.5" height="8" fill="brown"/>
        </svg>
    </div>
</body>
</html>
