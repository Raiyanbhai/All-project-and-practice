<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>line Element of SVG</title>
    <style>
        div{
            background-color:darkgray;
            /* height: 200px;
            width: 200px; */
        }
    </style>
</head>
<body>
    <div class="line-element">
        <svg  viewBox="-20 -20 100 100">
            <line x1="2" y1="2" x2="2" y2="8" stroke="chartreuse"></line>
            <line x1="2" y1="7.5" x2="6" y2="7.5"stroke="chartreuse"></line>
            <line x1="5.5" y1="6" x2="5.5" y2="7" stroke="chartreuse"></line>
            
            <line x1="7" y1="2" x2="7" y2="3" stroke="darkblue"></line>
            <line x1="7" y1="3.5" x2="7" y2="8" stroke="black"></line>
            
            <line x1="8.5" y1="2" x2="8.5" y2="8" stroke="coral"></line>
            <line x1="8.6" y1="2.3" x2="12" y2="7.7" stroke="coral"></line>
            <line x1="12" y1="2" x2="12" y2="8" stroke="coral"></line>
    
            <line x1="13.5" y1="2" x2="13.5" y2="8" stroke="darkmagenta"></line>
            <line x1="13.5" y1="2.5" x2="17" y2="2.5" stroke="darkmagenta"></line>
            <line x1="13.5" y1="5" x2="17" y2="5" stroke="darkmagenta"></line>
            <line x1="13.5" y1="7.5" x2="17" y2="7.5" stroke="darkmagenta"></line>
    

            <line x1="19" y1="5" x2="22" y2="5" stroke="black"></line>
    

            <line x1="24" y1="2" x2="24" y2="8" stroke="blueviolet"></line>
            <line x1="24" y1="2.5" x2="27" y2="2.5" stroke="blueviolet"></line>
            <line x1="24" y1="5" x2="27" y2="5" stroke="blueviolet"></line>
            <line x1="24" y1="7.5" x2="27" y2="7.5" stroke="blueviolet"></line>

            <line x1="28" y1="2" x2="28" y2="8" stroke="brown"></line>
            <line x1="28.5" y1="7.5" x2="32" y2="7.5" stroke="brown"></line>
            <line x1="31.5" y1="6" x2="31.5" y2="7.5" stroke="brown"></line>
    
            <line x1="33" y1="2" x2="33" y2="8" stroke="aqua"></line>
            <line x1="33" y1="2.5" x2="36" y2="2.5" stroke="aqua"></line>
            <line x1="33" y1="5" x2="36" y2="5" stroke="aqua"></line>
            <line x1="33" y1="7.5" x2="36" y2="7.5" stroke="aqua"></line>
    
            <line x1="37" y1="2" x2="37" y2="8" stroke="black"></line>
            <line x1="36.99" y1="2.3" x2="40" y2="5" stroke="black"></line>
            <line x1="42" y1="2.3" x2="39.5" y2="5" stroke="black"></line>
            <line x1="42" y1="2" x2="42" y2="8" stroke="black"></line>
    
            <line x1="43.5" y1="2" x2="43.5" y2="8" stroke="red"></line>
            <line x1="43" y1="2.5" x2="47" y2="2.5" stroke="red"></line>
            <line x1="43" y1="5" x2="47" y2="5" stroke="red"></line>
            <line x1="43" y1="7.5" x2="47" y2="7.5" stroke="red"></line>
    
            <line x1="48" y1="2" x2="48" y2="8" stroke="green"></line>
            <line x1="48" y1="2.3" x2="52" y2="7.7" stroke="green"></line>
            <line x1="52" y1="2" x2="52" y2="8" stroke="green"></line>
    
            <line x1="55.5" y1="2" x2="55.5" y2="8" stroke="blue"></line>
            <line x1="53" y1="2.5" x2="58" y2="2.5" stroke="blue"></line>
            <line x1="1" y1="9" x2="59" y2="9" stroke="black"></line>
        </svg>
    </div>
</body>
</html>
