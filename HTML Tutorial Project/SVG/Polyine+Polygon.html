<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Elements with Descriptions</title>
    <style>
        .description {
            position: absolute;
            display: none;
            background-color: white;
            border: 1px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 100 100" style="border: 1px solid black;">
        <polyline id="polyline1" points="40,20 80,40 50,60 30,50 40,20" stroke="black" fill="blue"></polyline>
        <polyline id="polyline2" points="10,5 20,2 30,10 25,18 15,20 9,15 10,5" stroke-width="0.5" stroke="black" fill="yellow"></polyline>
        <polyline id="polyline3" points="90,5 93,7 94,10 93,13 91,15 88,16 85,15.5 83,14 82,11.5 82,9 83,7 85,5 88,4.5 90,5" stroke-width="3" stroke="black" fill="pink"/>
        <circle id="circle" cx="20" cy="60" r="10" stroke="green" fill="purple"/>
        <polygon id="polygon" points="40,70 60,75 50,88 40,83" stroke="purple" fill="blue"/>
    </svg>
    <p id="desc1" class="description">Polyline 1</p>
    <p id="desc2" class="description">Polyline 2</p>
    <p id="desc3" class="description">Polyline 3</p>
    <p id="desc4" class="description">Circle</p>
    <p id="desc5" class="description">Polygon</p>

    <script>
        const elements = [
            { id: 'polyline1', desc: 'desc1' },
            { id: 'polyline2', desc: 'desc2' },
            { id: 'polyline3', desc: 'desc3' },
            { id: 'circle', desc: 'desc4' },
            { id: 'polygon', desc: 'desc5' }
        ];

        elements.forEach(element => {
            const svgElement = document.getElementById(element.id);
            const description = document.getElementById(element.desc);

            svgElement.addEventListener('mouseover', function(event) {
                const rect = event.target.getBoundingClientRect();
                description.style.top = `${rect.bottom + window.scrollY + 5}px`;
                description.style.left = `${rect.left + window.scrollX}px`;
                description.style.display = 'block';
            });

            svgElement.addEventListener('mouseout', function() {
                description.style.display = 'none';
            });
        });
    </script>
</body>
</html>
<!-- 

    const elements = [...]: यह एक कांस्टेंट (स्थिर) एरे (array) को परिभाषित करता है जिसका नाम elements है। इसमें पांच ऑब्जेक्ट्स (objects) हैं, 
    जिनमें प्रत्येक ऑब्जेक्ट में id और desc नामक गुण (properties) होते हैं। id SVG तत्व का आईडी है और desc संबंधित विवरण के p तत्व का आईडी है।
    
    elements.forEach(element => {...}): यह elements एरे के प्रत्येक आइटम पर एक फंक्शन (function) लागू करता है। element एरे का वर्तमान आइटम है।
    
    const svgElement = document.getElementById(element.id);: यह element.id का उपयोग करके संबंधित SVG तत्व को ढूंढता है और उसे svgElement में संग्रहीत करता है।
    
    const description = document.getElementById(element.desc);: यह element.desc का उपयोग करके संबंधित विवरण p तत्व को ढूंढता है और उसे description में संग्रहीत करता है।
    
    svgElement.addEventListener('mouseover', function(event) {...}): यह svgElement पर mouseover (माउस के ऊपर ले जाने) 
    इवेंट के लिए एक इवेंट लिसनर (event listener) जोड़ता है। जब माउस SVG तत्व पर जाता है, तो यह फंक्शन कॉल होता है।
    
    const rect = event.target.getBoundingClientRect();: यह SVG तत्व की स्थिति और आकार को rect में संग्रहीत करता है।

    description.style.top = ${rect.bottom + window.scrollY + 5}px;: यह विवरण के p तत्व की top स्थिति सेट करता है, जिससे यह SVG तत्व के नीचे 5 पिक्सेल पर दिखाई दे।

    description.style.left = ${rect.left + window.scrollX}px;: यह विवरण के p तत्व की left स्थिति सेट करता है, जिससे यह SVG तत्व के बाईं ओर संरेखित हो।

    description.style.display = 'block';: यह विवरण के p तत्व को प्रदर्शित (display) करता है।

    svgElement.addEventListener('mouseout', function() {...}): यह svgElement पर mouseout (माउस के बाहर जाने) 
    इवेंट के लिए एक इवेंट लिसनर जोड़ता है। जब माउस SVG तत्व से बाहर जाता है, तो यह फंक्शन कॉल होता है।
 
    description.style.display = 'none';: यह विवरण के p तत्व को छिपा देता है।
-->
