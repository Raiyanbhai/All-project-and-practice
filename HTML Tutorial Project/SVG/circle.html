<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Element</title>
</head>
<body>
    <svg viewBox="0 0 100 100">
        <circle cx="20" cy="20" r="10" stroke="blue" stroke-width="0.01" fill="aquamarine"/>

        <circle cx="24" cy="18" r="1" stroke="black" stroke-width="0.5" fill="white"/>

    </svg>
</body>
</html>
