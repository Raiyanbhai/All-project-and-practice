<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
            color: #333;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Experience</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice</td>
                <td>HR</td>
                <td>5 Years</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>IT</td>
                <td>8 Years</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
